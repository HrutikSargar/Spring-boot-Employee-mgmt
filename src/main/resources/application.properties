
spring.application.name=empmanagement

spring.datasource.url=jdbc:mysql://localhost:3306/2Yoe?createDatabaseIfNotExist=true
		spring.datasource.username=root
		spring.datasource.password=hrutik

		spring.jpa.hibernate.ddl-auto=update
		spring.jpa.show-sql=true


		# Formats the SQL in the console to be human-readable
		spring.jpa.properties.hibernate.format_sql=true

		# Explicitly sets the MySQL engine optimization 
		spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

		# Maximum number of simultaneous connections Hikari will keep open
		spring.datasource.hikari.maximum-pool-size=5

		# Minimum number of idle connections Hikari maintains in the pool
		spring.datasource.hikari.minimum-idle=2

		# How long (in milliseconds) the app will wait for a connection before throwing an error
		spring.datasource.hikari.connection-timeout=20000